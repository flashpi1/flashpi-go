version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
  # The SDK's own go.mod has no requirements; the tools module pins staticcheck.
  - package-ecosystem: gomod
    directories: [/, /internal/tools]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      go-modules:
        patterns: ['*']
